services:
  - type: web
    name: aeris-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/aeris.db
      - key: AERIS_DATA_MODE
        value: demonstration
      - key: AERIS_ENV
        value: demo
      - key: AUTH_DISABLED
        value: "true"
      - key: SECRET_KEY
        value: aeris-sih-2026-demo-key
      - key: CORS_ORIGINS
        value: "https://aeris-1-iy0y.onrender.com,http://localhost:3000"

  - type: web
    name: aeris-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://aeris-t3ji.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://aeris-t3ji.onrender.com/ws
      - key: NEXT_PUBLIC_DATA_MODE
        value: demonstration
      - key: PORT
        value: "10000"
