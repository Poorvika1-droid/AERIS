services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aeris
      MYSQL_USER: aeris
      MYSQL_PASSWORD: aeris
      MYSQL_ROOT_PASSWORD: aeris-root-password
    ports:
      - "3306:3306"
    volumes:
      - aeris_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5001:5000"
    volumes:
      - aeris_mlflow:/mlartifacts

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: mysql+pymysql://aeris:aeris@mysql:3306/aeris?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CORS_ORIGINS: http://localhost:3000
      AERIS_DATA_MODE: demonstration
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 10s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    env_file:
      - ../../.env.example
    environment:
      DATABASE_URL: mysql+pymysql://aeris:aeris@mysql:3306/aeris?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /repo:/repo/packages/schemas:/repo/packages/shared
    depends_on:
      - redis
      - mysql
      - api

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DATA_MODE: demonstration
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  aeris_mysql:
  aeris_mlflow:
