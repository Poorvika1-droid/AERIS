[build]
  base    = "apps/web"
  command = "npm run build"
  publish = "apps/web/out"

[build.environment]
  NODE_VERSION            = "22"
  NEXT_PUBLIC_API_URL     = "http://localhost:8000"
  NEXT_PUBLIC_WS_URL      = "ws://localhost:8000/ws"
  NEXT_PUBLIC_DATA_MODE   = "demonstration"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
